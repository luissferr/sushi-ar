<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget 3D Ramen</title>
    
    <!-- Fuentes para el botón -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Librería Model-Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        /* Reset fundamental para Iframes */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* El fondo transparente permite que se vea el fondo del WordPress de tu cliente */
            background-color: transparent !important; 
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }

        /* Estilo del botón AR - Mismo look premium que la landing page */
        .ar-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 100px;
            padding: 12px 24px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.4);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            white-space: nowrap;
        }

        .ar-button:hover {
            transform: translateX(-50%) translateY(-3px);
            box-shadow: 0 12px 30px rgba(255, 71, 87, 0.6);
            background-color: #ff5e6d;
        }

        .ar-button:active {
            transform: translateX(-50%) translateY(1px);
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }
        
        .ar-button svg {
            margin-top: -1px;
        }

        /* Spinner de carga para que no se vea vacío al inicio */
        .poster {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .loader {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            /* Si el cliente usa tema oscuro, igual prefieres cambiar rgba(0,0,0,0.1) a rgba(255,255,255,0.1) */
            border-top-color: #ff4757;
            border-radius: 50%;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- El modelo 3D ocupando todo el iframe -->
    <model-viewer 
        src="models/lowpoly_ramen_bowl.glb" 
        ios-src="models/Lowpoly_Ramen_Bowl.usdz#callToAction=Visitar%20Web&checkoutTitle=Sushi%20Academy&checkoutSubtitle=Descubre%20nuestros%20cursos"
        alt="Un espectacular bol de ramen en 3D" 
        ar 
        ar-modes="scene-viewer quick-look" 
        camera-controls 
        auto-rotate
        shadow-intensity="1.2"
        environment-image="neutral"
        exposure="1.1"
        interaction-prompt="auto">
        
        <!-- Botón personalizado para lanzar AR -->
        <button slot="ar-button" class="ar-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            Ver en mi mesa
        </button>
        
        <!-- Pantalla de carga mientras se baja el modelo -->
        <div slot="poster" class="poster">
            <div class="loader"></div>
        </div>
    </model-viewer>
</body>
</html>
